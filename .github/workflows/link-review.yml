name: Link Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/check_links.py'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_links.py
