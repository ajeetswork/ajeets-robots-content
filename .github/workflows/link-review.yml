name: Link Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'legacy-content/**'
      - 'scripts/check_links.py'
      - 'requirements-links.txt'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore link checker environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: linkcheck-${{ runner.os }}-py3.12-${{ hashFiles('requirements-links.txt') }}
      - name: Prepare link checker environment
        run: |
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          .venv/bin/pip install -r requirements-links.txt
      - run: .venv/bin/python scripts/check_links.py
