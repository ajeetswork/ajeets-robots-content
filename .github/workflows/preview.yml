name: Content Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-preview.mjs'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore preview transform cache
        uses: actions/cache@v4
        with:
          path: .cache/preview
          key: preview-${{ runner.os }}-node20-${{ hashFiles('templates/**', 'scripts/build-preview.mjs') }}
          restore-keys: |
            preview-${{ runner.os }}-node20-
      - run: npm ci --ignore-scripts
      - run: node scripts/build-preview.mjs --cache .cache/preview
