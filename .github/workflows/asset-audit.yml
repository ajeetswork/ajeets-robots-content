name: Asset Audit

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/**'
      - 'scripts/check_images.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_images.py
