name: Content Build

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'content-build.toml'
      - 'scripts/build_content.py'
  pull_request:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'content-build.toml'
      - 'scripts/build_content.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore rendered content cache
        uses: actions/cache@v4
        with:
          path: .cache/content-build
          key: content-build-${{ runner.os }}-${{ hashFiles('content/**/*.md', 'content-build.toml') }}
      - run: python scripts/build_content.py --cache-dir .cache/content-build
